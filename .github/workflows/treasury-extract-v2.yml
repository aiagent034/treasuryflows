name: Treasury Data Extract V2

on:
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      fiscal_years:
        description: 'Fiscal years to extract (comma-separated, e.g., FY2022,FY2023,FY2024)'
        required: false
        default: ''

jobs:
  extract-treasury-data-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verify commit being used
        run: |
          echo "Current commit:"
          git log -1 --format="%H %s"
          echo ""
          echo "Expected commit: fb093a7 (EMERGENCY FIX with safety limits)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Treasury data extraction
        id: extract
        run: |
          if [ -n "${{ github.event.inputs.fiscal_years }}" ]; then
            python src/treasury_extractor.py --years "${{ github.event.inputs.fiscal_years }}"
          else
            python src/treasury_extractor.py
          fi
        continue-on-error: false

      - name: Upload Excel Report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-report-v2-${{ github.run_number }}
          path: outputs/*.xlsx
          retention-days: 90

      - name: Upload Visualizations
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-visualizations-v2-${{ github.run_number }}
          path: outputs/*.png
          retention-days: 90

      - name: Upload Metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-metadata-v2-${{ github.run_number }}
          path: outputs/*.json
          retention-days: 90

      - name: Create success summary
        if: success()
        run: |
          echo "## ✅ Treasury Data Extraction Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Outputs Generated" >> $GITHUB_STEP_SUMMARY
          echo "- Excel reports: $(ls outputs/*.xlsx 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- Visualizations: $(ls outputs/*.png 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- Metadata files: $(ls outputs/*.json 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "All reports and visualizations are available in the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📅 Extraction Details" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow: Treasury Data Extract V2" >> $GITHUB_STEP_SUMMARY
          echo "- Run: \`${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: \`$(date -u)\`" >> $GITHUB_STEP_SUMMARY

      - name: Report failure
        if: failure()
        run: |
          echo "## ❌ Treasury Data Extraction Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The extraction process encountered an error. Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Common Issues:" >> $GITHUB_STEP_SUMMARY
          echo "- API unavailable or rate limited" >> $GITHUB_STEP_SUMMARY
          echo "- Requested fiscal year data not yet available" >> $GITHUB_STEP_SUMMARY
          echo "- Network connectivity issues" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Troubleshooting:" >> $GITHUB_STEP_SUMMARY
          echo "1. Check the commit SHA in 'Verify commit being used' step" >> $GITHUB_STEP_SUMMARY
          echo "2. Expected: fb093a7 (with safety limits)" >> $GITHUB_STEP_SUMMARY
          echo "3. Try again with fewer years: --years FY2023,FY2024" >> $GITHUB_STEP_SUMMARY
